@if (open) {
  <div class="overlay" [attr.data-testid]="testid">
    <button type="button" class="overlay__scrim" aria-label="Close dialog"
            [attr.data-testid]="testid + '-scrim'" (click)="closed.emit()"></button>
    <div class="sheet" role="dialog" aria-modal="true" [attr.aria-label]="title">
      <header class="sheet__head">
        <div class="sheet__grabber" aria-hidden="true"></div>
        <div class="sheet__titles">
          <h2 class="sheet__title">{{ title }}</h2>
          @if (description) { <p class="sheet__desc">{{ description }}</p> }
        </div>
        <button type="button" class="sheet__close" aria-label="Close"
                [attr.data-testid]="testid + '-close'" (click)="closed.emit()">&times;</button>
      </header>
      <div class="sheet__body scroll-y">
        <ng-content />
      </div>
    </div>
  </div>
}
