<div #stage class="stage" data-testid="work-bed-stage">
  <canvas #canvas class="stage__canvas" data-testid="work-bed-canvas" role="img"
          aria-label="Laser work bed showing nested parts and cut paths"></canvas>
  <div class="legend" data-testid="work-bed-legend">
    <span class="legend__item"><i class="swatch swatch--cut"></i>Cut path</span>
    <span class="legend__item"><i class="swatch swatch--bend"></i>Bend line</span>
    <span class="legend__item"><i class="swatch swatch--laser"></i>Laser head</span>
  </div>
</div>
